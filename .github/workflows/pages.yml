name: Deploy Website

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export NEXT_PUBLIC_BASE_PATH="/auto-quant"
          else
            export NEXT_PUBLIC_BASE_PATH="/$REPO_NAME/auto-quant"
          fi
          npm run build

      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf pages-root
          mkdir -p pages-root/auto-quant

          cp index.html app.js styles.css favicon.svg latest-date.txt manifest.webmanifest pages-root/
          cp service-worker.js service-worker-v12.js pages-root/
          cp -R data hub ai-database resume pages-root/
          cp -R out/* pages-root/auto-quant/
          touch pages-root/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-root

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
