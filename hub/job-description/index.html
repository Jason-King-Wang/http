<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="工作說明圖公開瀏覽頁，一個畫面顯示一張職缺說明圖，滑動可切換下一張。"
    />
    <title>工作說明圖 | 交易儀表板總入口</title>
    <style>
      :root {
        --bg: #101416;
        --panel-strong: rgba(255, 255, 255, 0.94);
        --ink: #eef5f3;
        --muted: #aebbb8;
        --line: rgba(255, 255, 255, 0.16);
        --accent: #56c7b5;
        --accent-soft: rgba(86, 199, 181, 0.18);
        --font-body: "Noto Sans TC", "Segoe UI Variable", "Microsoft JhengHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--font-body);
        background:
          linear-gradient(180deg, rgba(86, 199, 181, 0.1), transparent 34%),
          var(--bg);
      }

      a,
      button {
        font: inherit;
      }

      .viewer-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 4.25rem;
        padding: 0.7rem clamp(0.9rem, 2vw, 1.5rem);
        background: rgba(12, 16, 18, 0.78);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: grid;
        gap: 0.12rem;
        min-width: 12rem;
      }

      .brand strong {
        font-size: 1rem;
        letter-spacing: 0.02em;
      }

      .brand span {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .nav-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.45rem;
      }

      .nav-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.4rem;
        padding: 0.48rem 0.78rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.07);
        transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
      }

      .nav-links a:hover,
      .nav-links a.active {
        border-color: rgba(86, 199, 181, 0.5);
        color: #e9fffa;
        background: var(--accent-soft);
      }

      .viewer {
        height: 100svh;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        overscroll-behavior: contain;
      }

      .slide {
        min-height: 100svh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: grid;
        place-items: center;
        padding: 5.4rem clamp(0.75rem, 2vw, 1.4rem) 1.2rem;
      }

      .figure {
        width: min(100%, 1672px);
        margin: 0;
        display: grid;
        gap: 0.55rem;
        justify-items: center;
      }

      .figure img {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: calc(100svh - 8.4rem);
        object-fit: contain;
        border-radius: 8px;
        background: var(--panel-strong);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }

      figcaption {
        width: 100%;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.7rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      figcaption strong {
        color: var(--ink);
        font-weight: 700;
      }

      .progress {
        position: fixed;
        right: clamp(0.7rem, 1.6vw, 1.25rem);
        top: 50%;
        z-index: 19;
        display: grid;
        gap: 0.55rem;
        transform: translateY(-50%);
      }

      .progress button {
        width: 0.72rem;
        height: 0.72rem;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
        cursor: pointer;
      }

      .progress button.is-active {
        border-color: var(--accent);
        background: var(--accent);
        box-shadow: 0 0 0 0.28rem rgba(86, 199, 181, 0.18);
      }

      @media (max-width: 820px) {
        .viewer-nav {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.55rem;
        }

        .nav-links {
          justify-content: flex-start;
          flex-wrap: nowrap;
          width: 100%;
          overflow-x: auto;
          padding-bottom: 0.12rem;
          scrollbar-width: none;
        }

        .nav-links::-webkit-scrollbar {
          display: none;
        }

        .nav-links a {
          flex: 0 0 auto;
          white-space: nowrap;
        }

        .slide {
          padding-top: 6.9rem;
        }

        .figure img {
          max-height: calc(100svh - 10rem);
        }

        figcaption {
          align-items: flex-start;
          flex-direction: column;
          line-height: 1.45;
        }

        .progress {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .viewer {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>

    <div class="progress" aria-label="圖片頁次">
      <button class="is-active" type="button" data-target="0" aria-label="第 1 張"></button>
      <button type="button" data-target="1" aria-label="第 2 張"></button>
      <button type="button" data-target="2" aria-label="第 3 張"></button>
      <button type="button" data-target="3" aria-label="第 4 張"></button>
      <button type="button" data-target="4" aria-label="第 5 張"></button>
      <button type="button" data-target="5" aria-label="第 6 張"></button>
      <button type="button" data-target="6" aria-label="第 7 張"></button>
    </div>

    <script>
      const viewer = document.querySelector("#viewer");
      const slides = Array.from(document.querySelectorAll(".slide"));
      const dots = Array.from(document.querySelectorAll(".progress button"));
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let activeIndex = 0;
      let wheelLocked = false;

      function setActive(index) {
        activeIndex = Math.max(0, Math.min(index, slides.length - 1));
        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("is-active", dotIndex === activeIndex);
        });
      }

      function goTo(index) {
        const nextIndex = Math.max(0, Math.min(index, slides.length - 1));
        const target = slides[nextIndex];
        if (!target) {
          return;
        }
        setActive(nextIndex);
        target.scrollIntoView({
          behavior: reduceMotion ? "auto" : "smooth",
          block: "start",
        });
      }

      const observer = new IntersectionObserver(
        (entries) => {
          const visible = entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
          if (!visible) {
            return;
          }
          setActive(slides.indexOf(visible.target));
        },
        {
          root: viewer,
          threshold: [0.56, 0.72, 0.9],
        }
      );

      slides.forEach((slide) => observer.observe(slide));

      viewer.addEventListener(
        "wheel",
        (event) => {
          if (event.ctrlKey || Math.abs(event.deltaY) < Math.abs(event.deltaX) || Math.abs(event.deltaY) < 8) {
            return;
          }
          event.preventDefault();
          if (wheelLocked) {
            return;
          }
          wheelLocked = true;
          goTo(activeIndex + (event.deltaY > 0 ? 1 : -1));
          window.setTimeout(() => {
            wheelLocked = false;
          }, reduceMotion ? 120 : 620);
        },
        { passive: false }
      );

      viewer.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "PageDown" || event.key === " ") {
          event.preventDefault();
          goTo(activeIndex + 1);
        }
        if (event.key === "ArrowUp" || event.key === "PageUp") {
          event.preventDefault();
          goTo(activeIndex - 1);
        }
        if (event.key === "Home") {
          event.preventDefault();
          goTo(0);
        }
        if (event.key === "End") {
          event.preventDefault();
          goTo(slides.length - 1);
        }
      });

      dots.forEach((dot) => {
        dot.addEventListener("click", () => goTo(Number(dot.dataset.target)));
      });

      viewer.focus({ preventScroll: true });
    </script>
