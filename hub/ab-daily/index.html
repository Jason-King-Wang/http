<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="每日版本的 AB 選股模型輸出頁面，整合進交易儀表板總入口。" />
    <title>每日 AB | 交易儀表板總入口</title>
    <link rel="icon" href="../sell-model-embed/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/portal.css?v=20260611-terminal-refresh" />
  </head>
  <body data-page="ab-daily-wrapper">
    <div class="page-shell">
      <div class="ambient ambient-a" aria-hidden="true"></div>
      <div class="ambient ambient-b" aria-hidden="true"></div>
      <div class="ambient ambient-c" aria-hidden="true"></div>

      <main class="site">
        <header class="topbar">
          <div class="brand">
            <strong>交易儀表板總入口</strong>
            <span>每日版本的 AB 選股模型輸出</span>
          </div>
          <nav class="nav-links" aria-label="主站導覽">
            <a href="../index.html">首頁</a>
            <a class="active" href="./index.html">每日 AB</a>
            <a href="../sell-model/index.html">賣價模型</a>
            <a href="../short-term-radar/index.html">短線雷達</a>
            <a href="../auto-trading/index.html">自動交易</a>
            <a href="../job-description/index.html">工作說明圖</a>
            <a href="../../portfolio/index.html">AI 作品集</a>
          </nav>
        </header>

        <section class="hero">
          <div>
            <p class="eyebrow">AB Daily</p>
            <h1>每日版本的 AB 選股模型輸出</h1>
            <p>
              這頁專門看每天的 LLM A 預選與 B 預選。最新一天放最上面，下面保留逐日歷史；
              這裡不再收斂成 AB 定版，只記錄兩個預選池與當天表現。
            </p>
            <div class="pill-row" id="ab-page-meta"></div>
          </div>
          <aside class="hero-panel">
            <p class="eyebrow">更新節點</p>
            <h2>自動更新</h2>
            <p class="meta-line">每天早上先產生 A/B 預選；休盤日若有資料照樣更新，價格欄位顯示 NA。</p>
            <div class="frame-actions">
              <a class="action-link" href="../sell-model/index.html">回賣價模型</a>
              <a class="action-link" href="../index.html">回入口首頁</a>
            </div>
          </aside>
        </section>

        <section class="card ab-latest-shell">
          <div class="section-head">
            <div>
              <p class="eyebrow">Latest</p>
              <h2>最新一天</h2>
            </div>
            <button
              class="history-toggle latest-toggle"
              type="button"
              id="ab-latest-toggle"
              aria-controls="ab-latest-body"
              aria-expanded="true"
            >
              收起
            </button>
          </div>
          <div class="latest-body" id="ab-latest-body">
            <p class="section-copy" id="ab-latest-summary">讀取最新資料中...</p>
            <div class="pill-row" id="ab-latest-pills"></div>
            <div class="pool-grid" id="ab-latest-pools"></div>
          </div>
        </section>

        <section class="card ab-history-shell">
          <div class="section-head">
            <div>
              <p class="eyebrow">History</p>
              <h2>逐日歷史</h2>
            </div>
            <button
              class="history-summary-toggle"
              type="button"
              id="ab-history-summary-toggle"
              aria-controls="ab-history-list"
              aria-pressed="false"
            >
              只看每日 A/B 摘要
            </button>
          </div>
          <div class="history-stack" id="ab-history-list"></div>
        </section>
      </main>
    </div>

    <script src="../data/portal-manifest.js?v=20260611-terminal-refresh"></script>
    <script src="../assets/portal.js?v=20260611-terminal-refresh"></script>
  </body>
</html>
