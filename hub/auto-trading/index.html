<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="永豐自動交易頁面，整合進交易儀表板總入口。" />
    <title>自動交易 | 交易儀表板總入口</title>
    <link rel="stylesheet" href="../assets/portal.css" />
  </head>
  <body data-page="auto-trading-wrapper">
    <div class="page-shell">
      <div class="ambient ambient-a" aria-hidden="true"></div>
      <div class="ambient ambient-b" aria-hidden="true"></div>
      <div class="ambient ambient-c" aria-hidden="true"></div>

      <main class="site">
        <header class="topbar">
          <div class="brand">
            <strong>交易儀表板總入口</strong>
            <span>永豐自動交易分頁</span>
          </div>
          <nav class="nav-links" aria-label="主站導覽">
            <a href="../index.html">首頁</a>
            <a href="../sell-model/index.html">賣價模型</a>
            <a class="active" href="./index.html">自動交易</a>
          </nav>
        </header>

        <section class="hero">
          <div>
            <p class="eyebrow">自動交易</p>
            <h1>永豐自動交易整合頁</h1>
            <p>
              這裡集中顯示 current、latest daily 與 latest weekly，方便在同一個入口切換查看。
            </p>
            <div class="pill-row" id="auto-page-meta"></div>
          </div>
          <aside class="hero-panel">
            <p class="eyebrow">快速切換</p>
            <h2>切換不同頁面</h2>
            <div class="frame-actions">
              <a class="action-link" id="link-current" href="../auto-trading-embed/current.html">目前看板</a>
              <a class="action-link" id="link-daily" href="../auto-trading-embed/current.html">最新日報</a>
              <a class="action-link" id="link-weekly" href="../auto-trading-embed/current.html">最新週報</a>
            </div>
          </aside>
        </section>

        <section class="card frame-shell">
          <div>
            <p class="eyebrow">嵌入內容</p>
            <h2>自動交易頁面</h2>
          </div>
          <div class="iframe-wrap">
            <iframe
              id="auto-trading-frame"
              src="../auto-trading-embed/current.html"
              title="Auto Trading Embedded Dashboard"
            ></iframe>
          </div>
        </section>
      </main>
    </div>

    <script src="../data/portal-manifest.js"></script>
    <script src="../assets/portal.js"></script>
  </body>
</html>
