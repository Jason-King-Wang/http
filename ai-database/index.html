<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Agent 工作流與知識庫協作系統建置資料庫建立圖。" />
    <title>AI Agent 工作流與知識庫協作系統建置｜資料庫建立</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --ink: #122033;
        --muted: #64748b;
        --line: #dbe5f1;
        --accent: #1755a6;
        --shadow: 0 10px 28px rgba(18, 32, 51, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans TC", "Segoe UI", "Microsoft JhengHei", sans-serif;
      }

      .shell {
        width: min(1680px, calc(100% - 24px));
        margin: 0 auto;
        padding: 18px 0 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 2.4vw, 32px);
        line-height: 1.2;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 9px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .image-card {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .image-card img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 6px;
      }

      .note {
        margin: 10px 2px 0;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 720px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .actions {
          width: 100%;
          justify-content: flex-start;
        }

        .button {
          flex: 1 1 140px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>AI Agent 工作流與知識庫協作系統建置｜資料庫建立</h1>
        <nav class="actions" aria-label="圖片操作">
          <a class="button primary" href="./AI資料庫.png" target="_blank" rel="noopener">開啟原圖</a>
        </nav>
      </header>

      <section class="image-card" aria-label="AI Agent 工作流與知識庫協作系統建置圖">
        <img src="./AI資料庫.png" alt="AI Agent 工作流與知識庫協作系統建置資料庫建立圖" />
      </section>
      <p class="note">單頁圖片版，適合直接分享網址。</p>
    </main>
  </body>
</html>
